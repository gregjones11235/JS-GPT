services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: Qdrant
    ports:
      - "6333:6333" # REST API + Web UI (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    name: qdrant_storage # fixed name so it is not prefixed with the compose project name
